[package]
name = "xan_docopt"
version = "1.1.2"  #:version
authors = ["Andrew Gallant <jamslam@gmail.com>", "Guillaume Plique <guillaume.plique@sciencespo.fr>"]
description = "Command line argument parsing."
documentation = "https://github.com/Yomguithereal/docopt.rs"
homepage = "https://github.com/Yomguithereal/docopt.rs"
repository = "https://github.com/Yomguithereal/docopt.rs"
readme = "README.md"
keywords = ["docopt", "argument", "command", "argv"]
categories = ["command-line-interface"]
license = "Unlicense/MIT"
exclude = ["/.travis.yml", "/Makefile", "/ctags.rust", "/scripts/*", "/session.vim"]
edition = "2018"

[lib]
name = "docopt"

[[bin]]
name = "docopt-wordlist"
path = "src/wordlist.rs"
doc = false
test = false

[dependencies]
lazy_static = "1.3"
regex = { version = "1.4.0", default-features = false, features = ["std", "unicode"] }
serde = { version = "1.0", features = ["derive"] }
strsim = "0.10"
